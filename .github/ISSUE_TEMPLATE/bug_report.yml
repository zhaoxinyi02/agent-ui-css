name: Bug 报告 / Bug report
description: 报告可复现的问题 / Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请提供最小、可复现的信息。Thanks for helping improve the project.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 实际发生了什么？你期望什么结果？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Reproduction
      description: 请提供代码、仓库链接或逐步操作。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: React 19, Chrome 150, macOS 15
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional context
      description: 截图、日志或其他有帮助的信息。
