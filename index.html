<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent UI CSS — reusable React components for AI interfaces." />
    <title>Agent UI CSS</title>
    <script>
      (() => {
        try {
          const savedLanguage = localStorage.getItem("agent-ui-language");
          const savedTheme = localStorage.getItem("agent-ui-theme");
          const language = savedLanguage === "en" || savedLanguage === "zh"
            ? savedLanguage
            : navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
          document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
